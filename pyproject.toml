[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "a4print"
version = "0.6.0"
description = "Prepare any image for borderless A4 printing at 300 DPI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
dependencies = [
    "Pillow>=10.1",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "img2pdf>=0.5",
    "pikepdf>=8",
]

[project.optional-dependencies]
dev = ["pytest>=7"]
heic = ["pillow-heif>=1.2"]

[project.scripts]
a4print = "a4print.cli:main"
a4print-web = "a4print.web:main"
a4print-setup-ai = "a4print.setup_ai:main"
a4print-calibrate = "a4print.calibrate:main"

[tool.setuptools]
packages = ["a4print"]
