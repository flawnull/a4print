[build-system]
requires = ["setuptools>=64"]
build-backend = "setuptools.build_meta"

[project]
name = "a4print"
version = "0.1.0"
description = "Prepare any image for borderless A4 printing at 300 DPI"
readme = "README.md"
license = "MIT"
requires-python = ">=3.9"
dependencies = [
    "Pillow>=10.1",
    "opencv-python-headless>=4.8",
    "numpy>=1.24",
    "img2pdf>=0.5",
]

[project.optional-dependencies]
dev = ["pytest>=7"]

[project.scripts]
a4print = "a4print.cli:main"

[tool.setuptools]
packages = ["a4print"]
